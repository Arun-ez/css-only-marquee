<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Only Marquee Example</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100dvw;
            margin: 0;
        }

        marq {
            --height: attr(data-item-height type(<length>), 100px);
            --width: attr(data-item-width type(<length>), 200px);
            --duration: calc(attr(data-duration type(<number>), 30) * 1s);
            --space: attr(data-space type(<length>), 20px);

            width: 100dvw;
            height: var(--height);

            position: relative;
            margin-inline: auto;

            overflow: hidden;

            mask-image: linear-gradient(to right,
                    transparent,
                    black 20%,
                    black 80%,
                    transparent);

            marq-item {
                width: var(--width);
                height: var(--height);

                position: absolute;

                display: flex;
                justify-content: center;
                align-items: center;
                background: slateblue;
                color: white;
                border-radius: 36px;
                font-size: 64px;
                user-select: none;
                left: max(calc((var(--width) + var(--space)) * sibling-count()), 100%);
                animation: scrollLeft var(--duration) linear infinite;
                animation-delay: calc(var(--duration) / sibling-count() * (sibling-count() - sibling-index()) * -1);
            }
        }

        @keyframes scrollLeft {
            to {
                left: calc((var(--width) + var(--space)) * -1);
            }
        }
    </style>
</head>

<body>
    <marq data-duration="10" data-item-height="200px" data-item-width="300px" data-space="24px">
        <marq-item>1</marq-item>
        <marq-item>2</marq-item>
        <marq-item>3</marq-item>
        <marq-item>4</marq-item>
        <marq-item>5</marq-item>
        <marq-item>6</marq-item>
        <marq-item>7</marq-item>
        <marq-item>8</marq-item>
        <marq-item>9</marq-item>
        <marq-item>10</marq-item>
    </marq>
</body>

</html>
